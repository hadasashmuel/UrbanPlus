
name: Publish Client

on:
  push:
    branches:
      - main
    paths:
      - UrbanPlusClient/urban-plus/**
      - .github/workflows/publish-client.yml
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: UrbanPlusClient/urban-plus

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: UrbanPlusClient/urban-plus/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build client
        shell: pwsh
        env:
          VITE_API_URL: https://urbanpluspro.premiumasp.net
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_GOOGLE_CLIENT_ID)) {
            throw "VITE_GOOGLE_CLIENT_ID is missing or empty!"
          }

          npm run build

          $jsFiles = Get-ChildItem "dist/assets/*.js"

          $found = $false

          foreach ($file in $jsFiles) {
            $content = Get-Content $file.FullName -Raw

            if ($content.Contains($env:VITE_GOOGLE_CLIENT_ID)) {
              $found = $true
              break
            }
          }

          if (-not $found) {
            throw "Google Client ID was not found in the built JavaScript!"
          }

          Write-Host "Google Client ID successfully found in built JavaScript."

      - name: Validate build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/index.html")) {
            throw "Build output not found: dist/index.html"
          }

      - name: Deploy to MonsterASP.NET via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CLIENT_FTP_HOST }}
          username: ${{ secrets.CLIENT_FTP_USER }}
          password: ${{ secrets.CLIENT_FTP_PASS }}
          local-dir: ./UrbanPlusClient/urban-plus/dist/
          server-dir: ./wwwroot/
