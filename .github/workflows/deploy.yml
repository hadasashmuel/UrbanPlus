name: Build and deploy client to MonsterASP.NET

# צד השרת נפרס אוטומטית דרך ה-webhook של MonsterASP.
# ה-workflow הזה מטפל רק בצד הלקוח, ורץ רק כשיש שינוי בתיקיית הלקוח.
on:
  push:
    branches: [ main ]
    paths:
      - 'UrbanPlusClient/**'
  workflow_dispatch:

jobs:
  # --- צד לקוח (React + Vite) ---
  build_and_deploy_client:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: UrbanPlusClient/urban-plus
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: UrbanPlusClient/urban-plus/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: https://urbanpluspro.premiumasp.net
        run: npm run build

      - name: Deploy Client to MonsterASP.NET via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CLIENT_FTP_HOST }}
          username: ${{ secrets.CLIENT_FTP_USER }}
          password: ${{ secrets.CLIENT_FTP_PASS }}
          local-dir: ./UrbanPlusClient/urban-plus/dist/
          server-dir: ./wwwroot/
