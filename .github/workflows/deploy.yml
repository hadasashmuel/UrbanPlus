name: Build, publish and deploy to MonsterASP.NET

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # --- 1. צד שרת (.NET 10) ---
  build_and_deploy_server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Server
        # החליפי את הנתיב ל-csproj הספציפי של פרויקט ה-API שלך
        run: dotnet publish UrbanPlusServer/UrbanPlusServer.csproj --configuration Release --output ./publish-server --runtime win-x86

      - name: Put App Offline (Unlock IIS files)
        shell: pwsh
        env:
          FTP_HOST: ${{ secrets.SERVER_FTP_HOST }}
          FTP_USER: ${{ secrets.SERVER_FTP_USER }}
          FTP_PASS: ${{ secrets.SERVER_FTP_PASS }}
        run: |
          Set-Content -Path "app_offline.htm" -Value "<h1>Updating application, back in a moment...</h1>"
          curl.exe -T "app_offline.htm" "ftp://$env:FTP_HOST/wwwroot/app_offline.htm" --user "$($env:FTP_USER):$($env:FTP_PASS)" --ftp-ssl -k
          Start-Sleep -Seconds 3

      - name: Deploy Server to MonsterASP.NET via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SERVER_FTP_HOST }}
          username: ${{ secrets.SERVER_FTP_USER }}
          password: ${{ secrets.SERVER_FTP_PASS }}
          local-dir: ./publish-server/
          server-dir: ./wwwroot/
          exclude: |
            **/.git*
            **/.git*/**
            **/app_offline.htm

      - name: Bring App Online
        if: always()
        shell: pwsh
        env:
          FTP_HOST: ${{ secrets.SERVER_FTP_HOST }}
          FTP_USER: ${{ secrets.SERVER_FTP_USER }}
          FTP_PASS: ${{ secrets.SERVER_FTP_PASS }}
        run: |
          curl.exe -Q "-DELE /wwwroot/app_offline.htm" "ftp://$env:FTP_HOST/" --user "$($env:FTP_USER):$($env:FTP_PASS)" --ftp-ssl -k

  # --- 2. צד לקוח (React + Vite) ---
  build_and_deploy_client:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: UrbanPlusClient/urban-plus
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: UrbanPlusClient/urban-plus/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: https://urbanpluspro.premiumasp.net
        run: npm run build

      - name: Deploy Client to MonsterASP.NET via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CLIENT_FTP_HOST }}
          username: ${{ secrets.CLIENT_FTP_USER }}
          password: ${{ secrets.CLIENT_FTP_PASS }}
          local-dir: ./UrbanPlusClient/urban-plus/dist/
          server-dir: ./wwwroot/